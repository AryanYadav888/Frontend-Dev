<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Database</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid black; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        caption { font-weight: bold; font-size: 1.2em; margin-bottom: 10px; }
        small { display: block; margin-top: 5px; color: gray; text-align: right; }
    </style>
</head>
<body>

    <h1>Movie Database</h1>

    <table title="List of popular movies with details">

                <th>Genre</th>

                <th>IMDB Rating</th>
                <th>Link</th>
            </tr>

        <tbody>
            <tr title="Movie: Inception">
                <td>Inception</td>

            </tr>
            <tr title="Movie: The Dark Knight">
                <td>The Dark Knight</td>

                <td>2008</td>
                <td>9.0</td>

            <tr title="Movie: Interstellar">

            </tr>
            <tr title="Movie: Parasite">
                <td>Parasite</td>
                <td>Thriller</td>
                <td>2019</td>
                <td>8.6</td>
                <td><a href="https://www.imdb.com/title/tt6751668/" target="_blank">IMDB</a></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="5"><small>Note: Ratings are from IMDB as of 2025.</small></td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
