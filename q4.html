<!DOCTYPE html>
<html>
<head>
    <title>Multi API Dashboard</title>

    <style>
        .card {
            padding: 20px;
            margin: 10px;
            width: 200px;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-align: center;
            background: #f8f8f8;
            font-size: 18px;
        }
    </style>
</head>

<body>

<h2>Multi-API Dashboard</h2>

<div class="card">Total Users: <span id="usersCount">0</span></div>
<div class="card">Total Orders: <span id="ordersCount">0</span></div>
<div class="card">Total Products: <span id="productsCount">0</span></div>

<script>
const URL = "http://localhost:3004";

Promise.all([
    fetch(`${URL}/users`).then(res => res.json()),
    fetch(`${URL}/orders`).then(res => res.json()),
    fetch(`${URL}/products`).then(res => res.json())
])
.then(([users, orders, products]) => {
    document.getElementById("usersCount").innerText = users.length;
    document.getElementById("ordersCount").innerText = orders.length;
    document.getElementById("productsCount").innerText = products.length;
})
.catch(err => {
    console.error("Error loading dashboard:", err);
});
</script>

</body>
</html>
