<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span Example</title>
    <style>
        .hobby { color: blue; font-weight: bold; }
        .skill { color: green; font-style: italic; }
        .interest { color: orange; text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Span Example</h1>

    <p>
        My favorite <span class="hobby">hobby</span> is coding, and I have developed strong <span class="skill">problem-solving skills</span>. 
        Additionally, I have a keen <span class="interest">interest in artificial intelligence</span> and machine learning.
    </p>

</body>
</html>
